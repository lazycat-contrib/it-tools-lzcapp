application:
  subdomain: it-tools
  multi_instance: false
  public_path:
    - /

services:
  it-tools:
    # upstream: docker.io/sharevb/it-tools:2026.10.25
    image: docker.1ms.run/sharevb/it-tools:2026.10.25
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

usage: |
  IT-Tools 是开发者在线工具箱：JSON/YAML 格式化、Base64/URL 编码、
  正则测试、时间戳转换、UUID 生成、二维码等上百个小工具，打开即用无需配置。
